# Reusable ESPHome driver for ONE first-gen MySmartBlinds / Tilt motor
# (advertises SmartBlind_DFU). Adapted from the Home Assistant community guide
# "Local control of first-gen MySmartBlinds ... with ESPHome (no cloud)".
#
# Add it to any existing ESP32 config, once per blind (up to 2 per device),
# passing the blind's settings as package-local vars so several copies never
# share substitutions:
#
#   packages:
#     blind_office:
#       url: https://github.com/poldekch/mysmartblinds-esphome
#       ref: main
#       files:
#         - path: blind.package.yaml
#           vars:
#             blind_id:   office               # unique slug (a-z0-9_), used for IDs
#             blind_name: "Office"              # friendly name shown in HA
#             blind_mac:  "aa:bb:cc:dd:ee:ff"   # MAC exactly as in the keys dump
#             blind_key:  "000000000000"        # key exactly as in the keys dump
#
# (A local copy works the same way: `blind_office: !include { file:
# blind.package.yaml, vars: {...} }`.)
#
# Each blind holds one BLE connection while it moves or refreshes its sensors.
# Keep
#   (number of blinds) + bluetooth_proxy.connection_slots <= esp32_ble.max_connections
# (default 3) — see the README for a table.
#
# Both values are copied straight from the smartblinds-ble keys dump
# (smartblinds-import-cloud → smartblinds-keys.json); the package converts them:
#   - MAC: the dump holds the cloud MAC, whose byte order is the reverse of the
#     address the motor advertises (aa:bb:cc:dd:ee:ff → ff:ee:dd:cc:bb:aa). The
#     send script reverses it and sets it on the client before every connect.
#   - Key: hex in the dump's byte order, split into bytes in that same order
#     (what the forum post writes as [0x.., 0x.., ...]). "0x" prefixes, spaces,
#     commas and colons are ignored, so the forum-style list works too.
#
# Every ID below is prefixed with ${blind_id}, and the only shared component
# (esp32_ble_tracker) is declared empty, so this package merges cleanly with a
# device that already runs bluetooth_proxy / esp32_ble_tracker with its own
# settings — the device config always wins.
#
# Protocol. All characteristics share the base xxxxxxxx-1212-efde-1600-785feabcd123.
#   00001409  write the key first; nothing else works until it is written.
#   00001403  write one position byte: 100 = flat/open, 200 = closed one way,
#             and (per the older pysmartblinds notes, not yet verified here)
#             0 = closed the other way. Reading/indicating it returns the
#             motor's position on the same scale; it follows wand moves
#             (verified: 131 after a wand move, 199 after closing to 200).
#             Right after a move it returns the target until the motor
#             finishes. The cover's state follows this value.
#   00001402  status indication; bytes 0-3 are a little-endian bitfield:
#             0x00040000 = solar charging, 0x00080000 = USB charging.
#   00001651  power/sensor indication, 14 bytes: [0] battery %, [1] reserved,
#             then six little-endian uint16: battery voltage, battery charge,
#             solar-panel voltage, interior temperature, battery temperature,
#             raw light. Battery % is known; voltages look like mV and
#             temperatures like 0.1 degC (plausible values, not verified);
#             battery charge and light stay raw.
# Indications are enabled (CCCD written) only AFTER the key, as the official
# app does; the motor does not send 00001651 data otherwise. 00001651 is looked
# up by its UUID across all services, so the guessed service UUID on its sensor
# below doesn't affect whether it works.
# Moves and sensor reads use the same connection: every move also refreshes the
# sensors, and between moves the blind is polled on a schedule set by the
# "Sensor refresh interval" number entity (1-1440 min; default 10 min).

# Required by ble_client. Left empty on purpose: scan settings belong to the
# device config (e.g. a bluetooth_proxy), not to this package.
esp32_ble_tracker: {}

globals:
  # Target position byte for the next move (0 .. 200, 100 = flat).
  - id: ${blind_id}_target
    type: uint8_t
    restore_value: false
    initial_value: '100'
  # True while a move is waiting to be written; false = sensor refresh only.
  - id: ${blind_id}_move_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  # Set true by on_connect once the key (and position, if any) went out and
  # the sensors had a chance to report.
  - id: ${blind_id}_done
    type: bool
    restore_value: false
    initial_value: 'false'
  # True between the key write and the disconnect. Indications that arrive
  # before the key is accepted are ignored.
  - id: ${blind_id}_authed
    type: bool
    restore_value: false
    initial_value: 'false'
  # Which characteristics have reported on this connection, and which ones
  # are expected to (subscribed). Bit 0 = 00001651, 1 = 00001402, 2 = 00001403.
  - id: ${blind_id}_got
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: ${blind_id}_expect
    type: uint8_t
    restore_value: false
    initial_value: '0'
  # Set while our explicit read of 00001403 is outstanding, so the decoder can
  # log whether a value came from that read or from an indication.
  - id: ${blind_id}_pos_read
    type: bool
    restore_value: false
    initial_value: 'false'
  # Positions used by the cover's open / close actions ("smart" open/close),
  # set via the number entities below and kept across reboots. The close
  # position also decides which way the tilt slider closes (above or below 100).
  - id: ${blind_id}_open_pos
    type: int
    restore_value: true
    initial_value: '100'
  - id: ${blind_id}_close_pos
    type: int
    restore_value: true
    initial_value: '200'
  # Sensor refresh interval in minutes, set via the number entity below and
  # kept across reboots.
  - id: ${blind_id}_refresh_min
    type: float
    restore_value: true
    initial_value: '10'
  # millis() of the last connection attempt (move or refresh); 0 = never.
  - id: ${blind_id}_last_refresh
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Attribute handles found during service discovery, per connection.
  # Characteristic value handles of 00001651 / 00001402 / 00001403 (0 = absent).
  - id: ${blind_id}_handles
    type: std::vector<uint16_t>
    restore_value: false
  # One entry per characteristic to subscribe: (CCCD handle << 16) | CCCD value
  # (1 = notify, 2 = indicate).
  - id: ${blind_id}_cccds
    type: std::vector<uint32_t>
    restore_value: false

ble_client:
  - id: ${blind_id}_ble
    # Placeholder only: the send script replaces it with the reversed
    # (advertised) address before each connect.
    mac_address: ${blind_mac}
    auto_connect: false          # connect only on demand, freeing the radio
    on_connect:
      then:
        # 0. Runs synchronously inside service discovery, while the GATT cache
        #    still exists (ESPHome frees it once every node is established).
        #    Find the three indicating characteristics by UUID in ANY service,
        #    register for their indications locally, and remember the CCCD
        #    handles so they can be written after the key.
        - lambda: |-
            id(${blind_id}_authed) = false;
            id(${blind_id}_got) = 0;
            id(${blind_id}_expect) = 0;
            id(${blind_id}_pos_read) = false;
            uint8_t expect = 0;
            auto *cl = id(${blind_id}_ble);
            // 128-bit UUIDs in the stack's little-endian layout; bytes 12-13
            // hold the 16-bit short ID (0x1651 etc.).
            static const uint16_t shorts[3] = {0x1651, 0x1402, 0x1403};
            std::vector<uint16_t> handles(3, 0);
            std::vector<uint32_t> cccds;
            for (int i = 0; i < 3; i++) {
              esp_bt_uuid_t uuid = {};
              uuid.len = ESP_UUID_LEN_128;
              const uint8_t base[16] = {0x23, 0xd1, 0xbc, 0xea, 0x5f, 0x78, 0x00, 0x16,
                                        0xde, 0xef, 0x12, 0x12, 0x00, 0x00, 0x00, 0x00};
              memcpy(uuid.uuid.uuid128, base, 16);
              uuid.uuid.uuid128[12] = shorts[i] & 0xFF;
              uuid.uuid.uuid128[13] = shorts[i] >> 8;
              esp_gattc_char_elem_t chr;
              uint16_t count = 1;
              if (esp_ble_gattc_get_char_by_uuid(cl->get_gattc_if(), cl->get_conn_id(), 0x0001, 0xFFFF, uuid,
                                                 &chr, &count) != ESP_GATT_OK || count == 0) {
                ESP_LOGW("${blind_id}", "Characteristic 0x%04X not found; its sensors stay unavailable", shorts[i]);
                continue;
              }
              handles[i] = chr.char_handle;
              // Log (once per boot) which service each characteristic is in,
              // to pin down the service UUID for the decoder sensors.
              static bool svc_logged[3] = {false, false, false};
              if (!svc_logged[i]) {
                esp_gattc_service_elem_t svc;
                for (uint16_t off = 0;; off++) {
                  uint16_t n = 1;
                  if (esp_ble_gattc_get_service(cl->get_gattc_if(), cl->get_conn_id(), nullptr, &svc, &n, off) !=
                          ESP_GATT_OK || n == 0)
                    break;
                  if (chr.char_handle < svc.start_handle || chr.char_handle > svc.end_handle) continue;
                  svc_logged[i] = true;
                  if (svc.uuid.len == ESP_UUID_LEN_16) {
                    ESP_LOGI("${blind_id}", "0x%04X is in service 0x%04X", shorts[i], svc.uuid.uuid.uuid16);
                  } else if (svc.uuid.len == ESP_UUID_LEN_128) {
                    const uint8_t *u = svc.uuid.uuid.uuid128;
                    ESP_LOGI("${blind_id}",
                             "0x%04X is in service %02x%02x%02x%02x-%02x%02x-%02x%02x-%02x%02x-%02x%02x%02x%02x%02x%02x",
                             shorts[i], u[15], u[14], u[13], u[12], u[11], u[10], u[9], u[8], u[7], u[6], u[5], u[4],
                             u[3], u[2], u[1], u[0]);
                  }
                  break;
                }
              }
              esp_bt_uuid_t cccd_uuid = {};
              cccd_uuid.len = ESP_UUID_LEN_16;
              cccd_uuid.uuid.uuid16 = ESP_GATT_UUID_CHAR_CLIENT_CONFIG;
              esp_gattc_descr_elem_t descr;
              count = 1;
              if (esp_ble_gattc_get_descr_by_char_handle(cl->get_gattc_if(), cl->get_conn_id(), chr.char_handle,
                                                         cccd_uuid, &descr, &count) != ESP_GATT_OK || count == 0) {
                ESP_LOGW("${blind_id}", "Characteristic 0x%04X has no CCCD; cannot subscribe", shorts[i]);
                continue;
              }
              uint16_t en = (chr.properties & ESP_GATT_CHAR_PROP_BIT_INDICATE) ? 0x0002 : 0x0001;
              cccds.push_back(((uint32_t) descr.handle << 16) | en);
              expect |= 1 << i;
              // Tells the local stack to deliver indications for this handle.
              // (ESPHome also writes the CCCD now; that pre-key write may be
              // ignored by the motor, hence the second write after the key.)
              cl->register_for_notify(chr.char_handle);
              ESP_LOGD("${blind_id}", "0x%04X: value handle 0x%04X, CCCD 0x%04X, %s", shorts[i],
                       chr.char_handle, descr.handle, en == 2 ? "indicate" : "notify");
            }
            id(${blind_id}_handles) = handles;
            id(${blind_id}_cccds) = cccds;
            id(${blind_id}_expect) = expect;
        - delay: 200ms
        # 1. Authenticate: write the key to 00001409. The hex digits are paired
        #    into bytes in order; "0x" prefixes and separators are skipped.
        - ble_client.ble_write:
            id: ${blind_id}_ble
            service_uuid: '00001400-1212-efde-1600-785feabcd123'
            characteristic_uuid: '00001409-1212-efde-1600-785feabcd123'
            value: !lambda |-
              const std::string raw = "${blind_key}";
              std::string hex;
              for (size_t i = 0; i < raw.size(); i++) {
                if (raw[i] == '0' && i + 1 < raw.size() && (raw[i + 1] == 'x' || raw[i + 1] == 'X')) {
                  i++;
                  continue;
                }
                if (isxdigit((unsigned char) raw[i])) hex += raw[i];
              }
              std::vector<uint8_t> out;
              for (size_t i = 0; i + 1 < hex.size(); i += 2) {
                out.push_back((uint8_t) strtol(hex.substr(i, 2).c_str(), nullptr, 16));
              }
              ESP_LOGD("${blind_id}", "Sending %u-byte key", (unsigned) out.size());
              return out;
        - delay: 200ms
        # 2. Point the decoder sensors at the handles found above, then enable
        #    indications now that the key is in (one CCCD write per step so
        #    the stack never has two requests in flight).
        - lambda: |-
            id(${blind_id}_authed) = true;
            auto &h = id(${blind_id}_handles);
            id(${blind_id}_power_raw)->handle = h[0];
            id(${blind_id}_status_raw)->handle = h[1];
            id(${blind_id}_position_raw)->handle = h[2];
        - repeat:
            count: 3
            then:
              - lambda: |-
                  auto &c = id(${blind_id}_cccds);
                  if (iteration >= c.size()) return;
                  auto *cl = id(${blind_id}_ble);
                  uint16_t handle = c[iteration] >> 16;
                  uint8_t value[2] = {(uint8_t) (c[iteration] & 0xFF), 0x00};
                  esp_err_t err = esp_ble_gattc_write_char_descr(cl->get_gattc_if(), cl->get_conn_id(), handle,
                                                                 sizeof(value), value, ESP_GATT_WRITE_TYPE_RSP,
                                                                 ESP_GATT_AUTH_REQ_NONE);
                  if (err != ESP_OK) ESP_LOGW("${blind_id}", "Enabling indications at 0x%04X failed: %d", handle, err);
              - delay: 100ms
        # 3. Move, if a move is pending: write the target byte to 00001403.
        - if:
            condition:
              lambda: 'return id(${blind_id}_move_pending);'
            then:
              - ble_client.ble_write:
                  id: ${blind_id}_ble
                  service_uuid: '00001400-1212-efde-1600-785feabcd123'
                  characteristic_uuid: '00001403-1212-efde-1600-785feabcd123'
                  value: !lambda 'return { id(${blind_id}_target) };'
              - lambda: 'id(${blind_id}_move_pending) = false;'
              - delay: 500ms
        # 4. Read 00001403 explicitly as well, so the reported position gets a
        #    value on every connection even if the motor doesn't indicate it.
        - lambda: |-
            uint16_t handle = id(${blind_id}_handles)[2];
            if (handle == 0) return;
            auto *cl = id(${blind_id}_ble);
            id(${blind_id}_pos_read) = true;
            esp_err_t err = esp_ble_gattc_read_char(cl->get_gattc_if(), cl->get_conn_id(), handle, ESP_GATT_AUTH_REQ_NONE);
            if (err != ESP_OK) {
              id(${blind_id}_pos_read) = false;
              ESP_LOGW("${blind_id}", "Reading 0x1403 failed: %d", err);
            }
        # 5. Wait until every subscribed characteristic has reported (not
        #    just 00001651), so a refresh-only connection doesn't hang up
        #    before the position arrives.
        - wait_until:
            condition:
              lambda: 'return (id(${blind_id}_got) & id(${blind_id}_expect)) == id(${blind_id}_expect);'
            timeout: 3s
        - lambda: |-
            uint8_t missing = id(${blind_id}_expect) & ~id(${blind_id}_got);
            if (missing)
              ESP_LOGD("${blind_id}", "No data this connection from:%s%s%s", (missing & 1) ? " 0x1651" : "",
                       (missing & 2) ? " 0x1402" : "", (missing & 4) ? " 0x1403" : "");
        - lambda: 'id(${blind_id}_done) = true;'
        - ble_client.disconnect:
            id: ${blind_id}_ble
    on_disconnect:
      then:
        - lambda: 'id(${blind_id}_authed) = false;'

script:
  # Connect -> (on_connect writes key, enables indications, writes position if
  # a move is pending, collects sensor data) -> wait for done -> retry.
  # mode: restart so a new command supersedes one still in flight.
  - id: ${blind_id}_send
    mode: restart
    then:
      # Restart the refresh timer on every attempt (successful or not), so an
      # unreachable blind is retried at the refresh interval, not every minute.
      - lambda: |-
          id(${blind_id}_done) = false;
          id(${blind_id}_last_refresh) = std::max<uint32_t>(1, millis());
      - repeat:
          count: 3
          then:
            - if:
                condition:
                  lambda: 'return !id(${blind_id}_done);'
                then:
                  # Dial the advertised address: the dump's MAC with its byte
                  # order reversed. The motor uses a RANDOM address type;
                  # without it the client dials a public address and never
                  # connects. Both are set right before each connect (instead
                  # of in esphome.on_boot) so the package doesn't touch the
                  # device's esphome: block, and a disconnect that clears the
                  # address can't break the next attempt.
                  - lambda: |-
                      const std::string mac = "${blind_mac}";
                      uint64_t addr = 0;
                      int nibbles = 0;
                      uint8_t byte = 0;
                      for (char c : mac) {
                        if (!isxdigit((unsigned char) c)) continue;
                        byte = (byte << 4) | (uint8_t) strtol(std::string(1, c).c_str(), nullptr, 16);
                        if (++nibbles % 2 == 0) {
                          // Byte n of the dump becomes byte n from the END of
                          // the advertised address.
                          addr |= (uint64_t) byte << (8 * (nibbles / 2 - 1));
                          byte = 0;
                        }
                      }
                      if (nibbles != 12) {
                        ESP_LOGE("${blind_id}", "blind_mac '%s' is not a 6-byte MAC", mac.c_str());
                        return;
                      }
                      id(${blind_id}_ble).set_address(addr);
                      id(${blind_id}_ble).set_remote_addr_type(BLE_ADDR_TYPE_RANDOM);
                      ESP_LOGI("${blind_id}", "Connecting to %02X:%02X:%02X:%02X:%02X:%02X (dump MAC %s reversed)",
                               (unsigned) (addr >> 40) & 0xFF, (unsigned) (addr >> 32) & 0xFF,
                               (unsigned) (addr >> 24) & 0xFF, (unsigned) (addr >> 16) & 0xFF,
                               (unsigned) (addr >> 8) & 0xFF, (unsigned) addr & 0xFF, mac.c_str());
                      id(${blind_id}_ble).connect();
                  - wait_until:
                      condition:
                        lambda: 'return id(${blind_id}_done);'
                      timeout: 15s
                  - if:
                      condition:
                        lambda: 'return !id(${blind_id}_done);'
                      then:
                        - lambda: 'id(${blind_id}_ble).disconnect();'
                        - delay: 1s
      - if:
          condition:
            lambda: 'return !id(${blind_id}_done);'
          then:
            - logger.log:
                format: "%s: %s failed after 3 tries"
                args: ['"${blind_name}"', 'id(${blind_id}_move_pending) ? "move" : "sensor refresh"']

  # Move to a raw position byte (0..200). Shows it in the cover right away;
  # the motor's own report replaces it after the next connection.
  - id: ${blind_id}_move
    mode: queued
    parameters:
      pos: int
    then:
      - lambda: |-
          int p = std::max(0, std::min(200, pos));
          id(${blind_id}_target) = (uint8_t) p;
          id(${blind_id}_move_pending) = true;
          id(${blind_id}_show)->execute(p);
      - script.execute: ${blind_id}_send

  # Publish a raw position (0..200) as the cover's state. Tilt is how open the
  # slats are: 1.0 at 100 (flat), 0.0 at either closed end (0 or 200). Within
  # 5 steps of an end the cover counts as closed.
  - id: ${blind_id}_show
    mode: queued
    parameters:
      pos: int
    then:
      - lambda: |-
          float tilt = 1.0f - fabsf((float) pos - 100.0f) / 100.0f;
          tilt = std::max(0.0f, std::min(1.0f, tilt));
          auto *c = id(${blind_id}_cover);
          c->tilt = tilt;
          c->position = tilt <= 0.05f ? COVER_CLOSED : COVER_OPEN;
          c->current_operation = COVER_OPERATION_IDLE;
          c->publish_state();

  # Sensor refresh without moving. Never interrupts a move in progress (that
  # move refreshes the sensors anyway).
  - id: ${blind_id}_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(${blind_id}_send).is_running();'
          then:
            - script.execute: ${blind_id}_send

cover:
  - platform: template
    id: ${blind_id}_cover
    name: "${blind_name}"
    device_class: blind
    # State comes from the motor's reported position (see the _show script),
    # refreshed on every connection. assumed_state keeps both open and close
    # usable in HA, since the motor can be moved by the wand in between.
    assumed_state: true
    optimistic: false
    has_position: false
    # Open / close go to the configurable "smart" positions.
    open_action:
      - script.execute:
          id: ${blind_id}_move
          pos: !lambda 'return id(${blind_id}_open_pos);'
    close_action:
      - script.execute:
          id: ${blind_id}_move
          pos: !lambda 'return id(${blind_id}_close_pos);'
    # tilt is 0.0 (closed) .. 1.0 (flat); it closes toward the side of the
    # close position (200 side if it is >= 100, else 0 side).
    tilt_action:
      - script.execute:
          id: ${blind_id}_move
          pos: !lambda |-
            int dir = id(${blind_id}_close_pos) >= 100 ? 1 : -1;
            return 100 + dir * (int) lroundf((1.0f - tilt) * 100.0f);

sensor:
  # --- Decoders (internal). They only receive indications; on_connect points
  # them at the handles it found. Each publishes to the template sensors below,
  # which keep their value while the blind is disconnected (a ble_client sensor
  # itself drops to "unknown" on every disconnect).
  - platform: ble_client
    type: characteristic
    id: ${blind_id}_power_raw
    internal: true
    ble_client_id: ${blind_id}_ble
    # Guess: 00001651 is assumed to live in service 00001650. If that's wrong
    # you only get a "No sensor characteristic found" warning; on_connect finds
    # the characteristic by UUID regardless.
    service_uuid: '00001650-1212-efde-1600-785feabcd123'
    characteristic_uuid: '00001651-1212-efde-1600-785feabcd123'
    notify: true
    update_interval: never
    lambda: |-
      if (!id(${blind_id}_authed)) return NAN;
      if (x.size() < 14) {
        ESP_LOGW("${blind_id}", "0x1651: expected 14 bytes, got %u", (unsigned) x.size());
        return NAN;
      }
      auto u16 = [&x](size_t i) -> float { return (float) (uint16_t) (x[i] | (x[i + 1] << 8)); };
      auto s16 = [&x](size_t i) -> float { return (float) (int16_t) (x[i] | (x[i + 1] << 8)); };
      ESP_LOGD("${blind_id}", "0x1651: %s", format_hex_pretty(x).c_str());
      id(${blind_id}_battery).publish_state(x[0]);
      id(${blind_id}_battery_voltage).publish_state(u16(2) / 1000.0f);   // mV -> V (assumed)
      id(${blind_id}_battery_charge).publish_state(u16(4));               // raw
      id(${blind_id}_solar_voltage).publish_state(u16(6) / 1000.0f);     // mV -> V (assumed)
      id(${blind_id}_interior_temp).publish_state(s16(8) / 10.0f);       // 0.1 degC (assumed)
      id(${blind_id}_battery_temp).publish_state(s16(10) / 10.0f);       // 0.1 degC (assumed)
      id(${blind_id}_light).publish_state(u16(12));                       // raw
      id(${blind_id}_got) |= 1;
      return x[0];

  - platform: ble_client
    type: characteristic
    id: ${blind_id}_status_raw
    internal: true
    ble_client_id: ${blind_id}_ble
    service_uuid: '00001400-1212-efde-1600-785feabcd123'
    characteristic_uuid: '00001402-1212-efde-1600-785feabcd123'
    notify: true
    update_interval: never
    lambda: |-
      if (!id(${blind_id}_authed)) return NAN;
      if (x.size() < 4) {
        ESP_LOGW("${blind_id}", "0x1402: expected at least 4 bytes, got %u", (unsigned) x.size());
        return NAN;
      }
      uint32_t flags = (uint32_t) x[0] | ((uint32_t) x[1] << 8) | ((uint32_t) x[2] << 16) | ((uint32_t) x[3] << 24);
      ESP_LOGD("${blind_id}", "0x1402: %s (flags 0x%08X)", format_hex_pretty(x).c_str(), (unsigned) flags);
      id(${blind_id}_solar_charging).publish_state(flags & 0x00040000);
      id(${blind_id}_usb_charging).publish_state(flags & 0x00080000);
      char buf[11];
      snprintf(buf, sizeof(buf), "0x%08X", (unsigned) flags);
      id(${blind_id}_status_flags).publish_state(buf);
      id(${blind_id}_got) |= 2;
      return NAN;

  - platform: ble_client
    type: characteristic
    id: ${blind_id}_position_raw
    internal: true
    ble_client_id: ${blind_id}_ble
    service_uuid: '00001400-1212-efde-1600-785feabcd123'
    characteristic_uuid: '00001403-1212-efde-1600-785feabcd123'
    notify: true
    update_interval: never
    lambda: |-
      if (!id(${blind_id}_authed) || x.empty()) return NAN;
      // Receives both indications and the explicit read issued in on_connect.
      const char *src = id(${blind_id}_pos_read) ? "read" : "indication";
      id(${blind_id}_pos_read) = false;
      ESP_LOGD("${blind_id}", "0x1403 (%s): %s = %u", src, format_hex_pretty(x).c_str(), (unsigned) x[0]);
      id(${blind_id}_reported_position).publish_state(x[0]);
      // Drive the cover from it, except while a move is still to be written:
      // the value indicated then is the position BEFORE the move.
      if (!id(${blind_id}_move_pending)) id(${blind_id}_show)->execute(x[0]);
      id(${blind_id}_got) |= 4;
      return NAN;

  # --- Entities shown in Home Assistant. They keep their last value between
  # connections. Only battery % has verified units; volts and degC are inferred
  # from plausible readings. To correct one, redeclare it by id in your device
  # config and add filters (ESPHome merges list items with the same id).
  - platform: template
    id: ${blind_id}_battery
    name: "${blind_name} Battery"
    device_class: battery
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ${blind_id}_light
    name: "${blind_name} Light level (raw)"
    icon: mdi:brightness-5
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ${blind_id}_battery_voltage
    name: "${blind_name} Battery voltage"
    device_class: voltage
    unit_of_measurement: V
    entity_category: diagnostic
    disabled_by_default: true
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: ${blind_id}_battery_charge
    name: "${blind_name} Battery charge (raw)"
    icon: mdi:battery-charging
    entity_category: diagnostic
    disabled_by_default: true
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: ${blind_id}_solar_voltage
    name: "${blind_name} Solar panel voltage"
    device_class: voltage
    unit_of_measurement: V
    icon: mdi:solar-panel
    entity_category: diagnostic
    disabled_by_default: true
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: ${blind_id}_interior_temp
    name: "${blind_name} Interior temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    entity_category: diagnostic
    disabled_by_default: true
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: ${blind_id}_battery_temp
    name: "${blind_name} Battery temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    entity_category: diagnostic
    disabled_by_default: true
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  # Position the motor reports on 00001403 (0-200, 100 = flat). Also drives
  # the cover's state.
  - platform: template
    id: ${blind_id}_reported_position
    name: "${blind_name} Reported position (raw)"
    icon: mdi:blinds
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    id: ${blind_id}_solar_charging
    name: "${blind_name} Solar charging"
    device_class: battery_charging
    icon: mdi:solar-power
  - platform: template
    id: ${blind_id}_usb_charging
    name: "${blind_name} USB charging"
    device_class: battery_charging
    icon: mdi:usb-port
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  # First four bytes of the 00001402 status indication, for protocol research.
  - platform: template
    id: ${blind_id}_status_flags
    name: "${blind_name} Status flags"
    icon: mdi:flag
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

button:
  - platform: template
    id: ${blind_id}_refresh_button
    name: "${blind_name} Refresh sensors"
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - script.execute: ${blind_id}_refresh
  # Direct moves to the three fixed positions, regardless of the open/close
  # settings. Which physical direction "0 side" and "200 side" are (slats'
  # top toward the room or the window) depends on how the blind is mounted.
  - platform: template
    id: ${blind_id}_close_low_button
    name: "${blind_name} Close (0 side)"
    icon: mdi:blinds
    on_press:
      - script.execute:
          id: ${blind_id}_move
          pos: 0
  - platform: template
    id: ${blind_id}_flat_button
    name: "${blind_name} Open flat"
    icon: mdi:blinds-open
    on_press:
      - script.execute:
          id: ${blind_id}_move
          pos: 100
  - platform: template
    id: ${blind_id}_close_high_button
    name: "${blind_name} Close (200 side)"
    icon: mdi:blinds
    on_press:
      - script.execute:
          id: ${blind_id}_move
          pos: 200

number:
  # How often to connect just to read the sensors. Every connection costs the
  # motor some battery; moves refresh the sensors too and reset this timer.
  # The value lives in the restored global ${blind_id}_refresh_min, not in the
  # number's own restore_value: ESPHome keys a number's saved value by its
  # entity NAME, so it would bring back the value saved by the earlier
  # hours-based version of this entity instead of the 10-minute default.
  # A global's saved value is keyed by its id, which is new.
  - platform: template
    id: ${blind_id}_refresh_minutes
    name: "${blind_name} Sensor refresh interval"
    icon: mdi:timer-refresh-outline
    entity_category: config
    unit_of_measurement: min
    min_value: 1
    max_value: 1440           # 24 h
    step: 1
    mode: box
    update_interval: 60s
    lambda: 'return id(${blind_id}_refresh_min);'
    set_action:
      - lambda: 'id(${blind_id}_refresh_min) = x;'
      - component.update: ${blind_id}_refresh_minutes

  # "Smart" open and close: the raw positions (0-200, 100 = flat) the cover's
  # open and close actions go to. E.g. open 120 or 80 to angle the slats for
  # more light, close 0 instead of 200 to close the other way.
  - platform: template
    id: ${blind_id}_open_position
    name: "${blind_name} Open position"
    icon: mdi:blinds-open
    entity_category: config
    min_value: 0
    max_value: 200
    step: 1
    mode: box
    update_interval: 60s
    lambda: 'return id(${blind_id}_open_pos);'
    set_action:
      - lambda: 'id(${blind_id}_open_pos) = (int) x;'
      - component.update: ${blind_id}_open_position
  - platform: template
    id: ${blind_id}_close_position
    name: "${blind_name} Close position"
    icon: mdi:blinds
    entity_category: config
    min_value: 0
    max_value: 200
    step: 1
    mode: box
    update_interval: 60s
    lambda: 'return id(${blind_id}_close_pos);'
    set_action:
      - lambda: 'id(${blind_id}_close_pos) = (int) x;'
      - component.update: ${blind_id}_close_position

interval:
  # Checks every 10 s whether a refresh is due (fine enough for a 1-minute
  # setting). The first refresh happens about a minute after boot so the
  # entities are filled in early.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              float minutes = id(${blind_id}_refresh_min);
              if (isnan(minutes) || minutes < 1) return false;
              uint32_t now = millis();
              uint32_t last = id(${blind_id}_last_refresh);
              if (last == 0) return now >= 60000;
              return now - last >= (uint32_t) (minutes * 60000.0f);
          then:
            - script.execute: ${blind_id}_refresh
