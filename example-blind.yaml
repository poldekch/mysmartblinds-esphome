# Example: an existing ESP32 node (here a Bluetooth proxy) with ONE blind added.
# The package is pulled straight from GitHub; replace the vars with the values
# the generator prints for your blind:
#
#   python -m smartblinds_ble.tools.control --esphome smartblinds-keys.json

esphome:
  name: living-room-proxy

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
logger:

# --- your existing BLE setup; the package never overrides it ---
esp32_ble_tracker:
  scan_parameters:
    active: true

# BLE connection budget: blinds + proxy connection_slots <= max_connections.
# 1 blind + 2 proxy slots = 3, which fits the ESP32 default of 3.
# (Alternative: keep 3 proxy slots and set esp32_ble: max_connections: 4.)
bluetooth_proxy:
  active: true
  connection_slots: 2

# --- the blind ---
packages:
  blind_office:
    url: https://github.com/poldekch/mysmartblinds-esphome
    ref: main
    refresh: 1d
    files:
      - path: blind.package.yaml
        vars:
          blind_id: office
          blind_name: "Office Blind"
          blind_mac: "aa:bb:cc:dd:ee:ff"
          blind_key: "000000000000"
